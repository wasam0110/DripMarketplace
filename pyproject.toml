[tool.pytest.ini_options]
asyncio_mode     = "auto"
testpaths        = ["tests"]
python_files     = ["test_*.py"]
python_classes      = ["Test*"]
python_functions    = ["test_*"]
addopts             = [
    "--strict-markers",
    "--tb=short",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=85",
    "-q",
]
markers = [
    "unit:        Pure unit tests — no DB, no Redis",
    "integration: Tests that hit a real database and/or Redis",
    "security:    Security-focused tests",
    "slow:        Tests that take > 2 seconds",
]
filterwarnings = [
    "ignore::DeprecationWarning:asyncpg",
    "ignore::DeprecationWarning:sqlalchemy",
]

# ── Ruff linter + formatter ────────────────────────────────────────────────────
[tool.ruff]
target-version = "py313"
line-length    = 100
src            = ["app", "tests"]
exclude        = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "S",   # bandit security checks
    "ANN", # type annotations
]
ignore = [
    "ANN101",  # Missing type annotation for `self`
    "ANN102",  # Missing type annotation for `cls`
    "S101",    # Use of assert (allowed in tests)
    "B008",    # Do not perform function calls in default arguments (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN"]
"alembic/**" = ["ANN", "N999"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ── mypy type checker ─────────────────────────────────────────────────────────
[tool.mypy]
python_version         = "3.13"
strict                 = true
ignore_missing_imports = true
exclude                = ["alembic/", "tests/"]
plugins                = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["jose.*", "argon2.*", "magic.*", "pyotp.*", "qrcode.*", "arq.*", "structlog.*"]
ignore_missing_imports = true

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source   = ["app"]
omit     = ["*/tests/*", "*/migrations/*", "alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "pass$",
]