version: "3.9"

# ══════════════════════════════════════════════════════════════════════════════
# DRIP Local Development Stack
# ══════════════════════════════════════════════════════════════════════════════
# Usage:
#   docker compose up -d          → Start postgres + redis in background
#   docker compose down           → Stop all services
#   docker compose down -v        → Stop and delete volumes (fresh DB)
#
# The FastAPI app is run locally (not in Docker) for hot-reload:
#   uvicorn main:app --reload
# ══════════════════════════════════════════════════════════════════════════════

services:

  postgres:
    image: postgres:15-alpine
    container_name: drip_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       drip
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - drip_postgres_data:/var/lib/postgresql/data
      # Auto-run schema on first start
      - ./docs/database/13-database-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d drip"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: drip_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - drip_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional: pgAdmin for database inspection
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: drip_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@drip.pk
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT:      5050
    ports:
      - "5050:5050"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools   # Only starts with: docker compose --profile tools up

volumes:
  drip_postgres_data:
  drip_redis_data:

networks:
  default:
    name: drip_network